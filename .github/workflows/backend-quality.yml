name: Backend Quality (Lint & Test)

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "package.json"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - "package.json"
      - ".github/workflows/backend-quality.yml"

jobs:
  backend-quality:
    name: Backend Lint and Unit Tests
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/corporacao_db?schema=public
      JWT_SECRET: test_secret
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: corporacao_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Setup Database for Tests
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Run Lint
        working-directory: ./backend
        run: npm run lint

      - name: Run Tests
        working-directory: ./backend
        run: npm test -- --forceExit --detectOpenHandles
