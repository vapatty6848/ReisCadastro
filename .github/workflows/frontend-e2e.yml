name: Frontend E2E Tests (Playwright)

on:
  push:
    branches: [main, master, CI/division-workflows]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-e2e.yml"
  pull_request:
    branches: [main, master, CI/division-workflows]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-e2e.yml"

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/corporacao_db?schema=public
      JWT_SECRET: test_secret
      NEXT_PUBLIC_API_URL: http://localhost:3001

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: corporacao_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd backend && (npm ci || npm install)
          cd ../frontend && (npm ci || npm install)

      - name: Setup Backend and Seed DB
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npx prisma db seed
          NODE_ENV=test npm run dev > /dev/null 2>&1 &

      - name: Wait for Backend
        run: |
          count=0
          until curl --output /dev/null --silent --head --fail http://localhost:3001/api/health; do
            if [ $count -eq 60 ]; then
              echo "Timeout: Backend failed to start after 60 seconds"
              exit 1
            fi
            echo "Waiting for backend to be ready at http://localhost:3001/api/health... ($count/60)"
            sleep 1
            count=$((count+1))
          done

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
