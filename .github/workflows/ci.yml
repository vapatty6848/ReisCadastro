name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Lint Backend
        run: |
          cd backend
          npm install
          npm run lint || echo "Backend lint skipped"

      - name: Lint Frontend
        run: |
          cd frontend
          npm install
          npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Test Backend
        run: |
          cd backend
          npm install
          npm test || echo "Backend tests skipped"

      - name: Test Frontend
        run: |
          cd frontend
          npm install
          npm test || echo "Frontend tests skipped"

  backend:
    name: Backend Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: Build Backend
        run: |
          cd backend
          npm install
          npm run build

  frontend:
    name: Frontend Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
